framework:
    test: true
    secret: 'test'
    cache:
        pools:
            rate_limiter_cache:
                adapter: cache.adapter.array
    lock:
        flock: ~

services:
    app.bedrock_runtime:
        class: AsyncAws\BedrockRuntime\BedrockRuntimeClient
        arguments:
            - { region: 'eu-west-1', accessKeyId: 'AKIDTEST', accessKeySecret: 'SECRETTEST' }

lingoda_ai:
    default_provider: bedrock
    providers:
        bedrock:
            runtime_client: 'app.bedrock_runtime'
            default_model: 'anthropic.claude-haiku-4-5-20251001-v1:0'
        typesafe:
            api_key: 'test-typesafe-key'
            default_model: 'jev-latest'
    sanitization:
        patterns: ['/voucher-\d{4}/']
    logging:
        enabled: false
    rate_limiting:
        enabled: true
        storage: 'rate_limiter_cache'
        lock_factory: 'lock.flock.factory'
        providers:
            bedrock:
                requests: ~
                tokens: ~
